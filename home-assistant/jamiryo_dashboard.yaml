{
  "title": "Jamiryo",
  "views": [
    {
      "title": "Chat",
      "path": "sohbet",
      "icon": "mdi:robot-happy-outline",
      "cards": [
        {
          "type": "markdown",
          "content": "# Jamiryo\nTalk to your desktop companion remotely.\n\nAsk a question, read a message aloud at home, or request a fresh camera photo."
        },
        {
          "type": "entities",
          "title": "Send a message",
          "show_header_toggle": false,
          "entities": [
            {
              "entity": "input_text.jamiryo_message",
              "name": "Your message",
              "icon": "mdi:message-text-outline"
            },
            {
              "entity": "input_select.jamiryo_mode",
              "name": "Action",
              "icon": "mdi:format-list-bulleted"
            },
            {
              "entity": "script.jamiryo_send",
              "name": "Send to Jamiryo",
              "action_name": "Send"
            }
          ]
        },
        {
          "type": "button",
          "name": "Send photo",
          "icon": "mdi:camera",
          "show_state": false,
          "tap_action": {
            "action": "perform-action",
            "perform_action": "script.jamiryo_send",
            "data": {
              "mode": "photo",
              "message": ""
            }
          }
        },
        {
          "type": "markdown",
          "title": "Connection and request",
          "content": "{% set t = state_attr('sensor.jamiryo_messenger','last_seen') | float(0) %}\n{% set s = states('sensor.jamiryo_messenger') %}\n{% if as_timestamp(now()) - t > 45 %}\n**Status:** Offline or not ready yet.\n{% else %}\n**Status:** {{ {'ready':'Connected and ready','processing':'Processing…','done':'Done','error':'Request failed'}.get(s,s) }}\n{% endif %}\n{% if state_attr('sensor.jamiryo_messenger','error') %}\nError: `{{ state_attr('sensor.jamiryo_messenger','error') }}`\n{% endif %}\n{% if state_attr('sensor.jamiryo_messenger','notification_error') %}\nPhone notification failed: `{{ state_attr('sensor.jamiryo_messenger','notification_error') }}`. The reply is shown below.\n{% endif %}"
        },
        {
          "type": "markdown",
          "title": "Last reply",
          "content": "<pre style=\"white-space: pre-wrap; overflow-wrap: anywhere;\">{{ (state_attr('sensor.jamiryo_messenger','reply') or 'No reply yet.') | e }}</pre>"
        },
        {
          "type": "markdown",
          "content": "{% set image = state_attr('sensor.jamiryo_messenger','image') %}{% if image %}[Open the latest photo]({{ image }}){% endif %}"
        },
        {
          "type": "markdown",
          "content": "Short messages only: up to 140 characters, subject to the 255-character JSON envelope limit. Wait while the robot replies. A person at home can explicitly ask **“Telefonuma mesaj gönder: …”** to send a phone reply. Ordinary room conversations are not forwarded automatically.\n\nPhotos go to the selected HA Companion phone. Your existing private HA access, such as Tailscale, can make this panel available away from home."
        }
      ]
    }
  ]
}
