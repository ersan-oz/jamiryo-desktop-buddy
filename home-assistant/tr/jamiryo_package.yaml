{
  "input_text": {
    "jamiryo_message": {
      "name": "Jamiryo message",
      "min": 0,
      "max": 140,
      "initial": "",
      "mode": "text"
    },
    "jamiryo_inbox": {
      "name": "Jamiryo inbox",
      "min": 0,
      "max": 255,
      "initial": "",
      "mode": "text"
    }
  },
  "input_select": {
    "jamiryo_mode": {
      "name": "Jamiryo mode",
      "options": [
        "Jamiryo’ya sor",
        "Evde sesli okut",
        "Fotoğraf gönder"
      ]
    }
  },
  "script": {
    "jamiryo_gonder": {
      "alias": "Jamiryo gönder",
      "description": "Telefondan soru, sesli mesaj veya tek fotoğraf isteği gönderir.",
      "icon": "mdi:robot-happy-outline",
      "mode": "single",
      "max_exceeded": "silent",
      "fields": {
        "mode": {
          "name": "İşlem",
          "selector": {
            "select": {
              "options": [
                "ask",
                "say",
                "photo"
              ]
            }
          }
        },
        "message": {
          "name": "Mesaj",
          "selector": {
            "text": {}
          }
        }
      },
      "sequence": [
        {
          "variables": {
            "send_mode": "{{ mode | default({'Jamiryo’ya sor':'ask','Evde sesli okut':'say','Fotoğraf gönder':'photo'}.get(states('input_select.jamiryo_mode'),'ask')) }}",
            "send_text": "T:{{ message | default(states('input_text.jamiryo_message')) | string | trim }}",
            "request_id": "m{{ utcnow().strftime('%Y%m%d%H%M%S%f') }}",
            "previous": "{{ states('input_text.jamiryo_inbox')[3:] | from_json({}) }}"
          }
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ as_timestamp(now()) - (state_attr('sensor.jamiryo_messenger','last_seen') | float(0)) > 45 }}"
            }
          ],
          "then": [
            {
              "stop": "Jamiryo çevrimdışı. Robotun ev Wi-Fi’sine bağlı olduğunu kontrol et.",
              "error": true
            }
          ]
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ is_state('sensor.jamiryo_messenger','processing') }}"
            }
          ],
          "then": [
            {
              "stop": "Önce devam eden isteğin bitmesini bekle.",
              "error": true
            }
          ]
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ previous.get('id','') and previous.get('id') != state_attr('sensor.jamiryo_messenger','request_id') and as_timestamp(now()) - (previous.get('at',0) | float(0)) < 120 }}"
            }
          ],
          "then": [
            {
              "stop": "Önceki mesaj henüz alınmadı; kısa süre bekle.",
              "error": true
            }
          ]
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ send_mode not in ['ask','say','photo'] or (send_mode != 'photo' and not (send_text[2:] | trim)) }}"
            }
          ],
          "then": [
            {
              "stop": "Bir mesaj yaz veya Fotoğraf gönder işlemini seç.",
              "error": true
            }
          ]
        },
        {
          "variables": {
            "envelope": "J1:{{ {'v':1,'id':request_id | string,'mode':send_mode | string,'text':('' if send_mode == 'photo' else send_text[2:]),'at':as_timestamp(now()) | int} | to_json(ensure_ascii=False) }}"
          }
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ envelope | length > 255 }}"
            }
          ],
          "then": [
            {
              "stop": "Mesaj çok uzun; biraz kısaltıp yeniden gönder.",
              "error": true
            }
          ]
        },
        {
          "action": "input_text.set_value",
          "target": {
            "entity_id": "input_text.jamiryo_inbox"
          },
          "data": {
            "value": "{{ envelope }}"
          }
        }
      ]
    }
  }
}
